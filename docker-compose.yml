services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: homechef
      POSTGRES_PASSWORD: homechef
      POSTGRES_DB: homechef
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    env_file: .env
    volumes:
      - .:/app
      - whisper_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
  whisper_cache:
