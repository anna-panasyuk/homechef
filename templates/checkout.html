{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-3">Checkout</h1>
{% if listing %}
<div class="bg-white border rounded-lg p-4 space-y-3">
  <div class="font-semibold">{{ listing.dish }}</div>
  <div class="text-sm text-neutral-500">₹{{ listing.price_inr }} per portion · {{ listing.portions }} available</div>
  <form method="post" action="/checkout/{{ listing.id }}" class="space-y-3">
    <label class="block text-sm">Quantity
      <input type="number" name="qty" min="1" max="{{ listing.portions }}" value="1"
             class="w-full border rounded px-3 py-2 mt-1">
    </label>
    <button class="w-full bg-neutral-900 text-white py-2 rounded">Confirm order</button>
  </form>
</div>
{% endif %}
{% endblock %}
