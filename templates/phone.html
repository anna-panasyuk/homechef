{% extends "base.html" %}
{% block title %}Cook phone{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-3">Cook phone</h1>

<form method="get" action="/phone" class="mb-4">
  <label class="block text-sm mb-1">Cook</label>
  <select name="cook_phone" onchange="this.form.submit()"
          class="w-full border rounded p-2 text-sm">
    {% for c in cooks %}
    <option value="{{ c.phone }}" {% if selected and c.id == selected.id %}selected{% endif %}>
      {{ c.name }} ({{ c.phone }}) · {{ c.channel }} · limit {{ c.batch_limit }}
    </option>
    {% endfor %}
  </select>
</form>

<section class="bg-white border rounded-lg p-3 mb-4 h-80 overflow-y-auto">
  {% for m in messages %}
    <div class="mb-2 {% if m.direction == 'in' %}text-left{% else %}text-right{% endif %}">
      <span class="inline-block text-sm px-3 py-1 rounded-lg
        {% if m.direction == 'in' %}bg-neutral-100{% else %}bg-neutral-900 text-white{% endif %}">
        {{ m.text }}
      </span>
    </div>
  {% else %}
    <p class="text-sm text-neutral-500">No messages yet.</p>
  {% endfor %}
</section>

{% if selected %}
<form id="smsForm" class="space-y-2">
  <input type="hidden" name="cook_phone" value="{{ selected.phone }}">
  <textarea name="text" rows="2" required
            class="w-full border rounded p-2 text-sm"
            placeholder="kal 15 dal chawal 80, 12-2pm"></textarea>
  <button class="w-full bg-neutral-900 text-white py-2 rounded">Send SMS</button>
</form>
<script>
document.getElementById("smsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch("/phone/sms", { method: "POST", body: fd });
  if (r.ok) location.reload();
});
</script>
{% endif %}
{% endblock %}
