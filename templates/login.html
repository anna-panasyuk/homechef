{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-3">Login</h1>
<form method="post" action="/login" class="space-y-3 bg-white p-4 border rounded-lg">
  <input name="name" value="{{ name or '' }}" placeholder="Name" required
         class="w-full border rounded px-3 py-2">
  <input name="phone" value="{{ phone or '' }}" placeholder="Phone" required
         class="w-full border rounded px-3 py-2">
  {% if step == 'otp' %}
    <input name="otp" placeholder="OTP (use 1234)" required
           class="w-full border rounded px-3 py-2">
  {% else %}
    <input type="hidden" name="otp" value="">
  {% endif %}
  <button class="w-full bg-neutral-900 text-white py-2 rounded">
    {% if step == 'otp' %}Verify{% else %}Send OTP{% endif %}
  </button>
  {% if step == 'otp' %}
    <p class="text-xs text-neutral-500">Demo OTP is always 1234.</p>
  {% endif %}
</form>
{% endblock %}
