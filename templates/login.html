{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-3">Log in</h1>
<form method="post" action="/login" class="space-y-3 bg-white p-4 border rounded-lg">
  <input name="email" type="email" value="{{ email or '' }}" placeholder="Email" required
         class="w-full border rounded px-3 py-2">
  <input name="password" type="password" placeholder="Password" required
         class="w-full border rounded px-3 py-2">
  {% if error %}<p class="text-sm text-red-600">{{ error }}</p>{% endif %}
  <button class="w-full bg-neutral-900 text-white py-2 rounded">Log in</button>
  <p class="text-sm text-neutral-600">No account? <a href="/signup" class="underline">Sign up</a></p>
</form>
{% endblock %}
