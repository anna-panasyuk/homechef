{% extends "base.html" %}
{% block content %}
<form method="get" action="/" class="mb-4 flex gap-2">
  <input name="area" value="{{ area or '' }}" placeholder="Area (e.g. Koramangala)"
         class="flex-1 border rounded px-3 py-2 text-sm">
  <button class="bg-neutral-900 text-white px-3 py-2 rounded text-sm">Go</button>
</form>

<h1 class="text-xl font-semibold mb-3">Tomorrow's dishes</h1>
<ul class="space-y-3">
  {% for l in listings %}
  <li class="bg-white rounded-lg border p-3">
    <a href="/dish/{{ l.id }}" class="block">
      <div class="flex justify-between">
        <div>
          <div class="font-semibold">{{ l.dish }}</div>
          <div class="text-xs text-neutral-500">{{ l.region }} · {{ l.cook.name }} · {{ l.cook.area }}</div>
        </div>
        <div class="text-right">
          <div class="font-semibold">₹{{ l.price_inr }}</div>
          <div class="text-xs text-neutral-500">{{ l.portions }} left</div>
        </div>
      </div>
    </a>
  </li>
  {% else %}
  <li class="text-sm text-neutral-500">No listings.</li>
  {% endfor %}
</ul>
{% endblock %}
