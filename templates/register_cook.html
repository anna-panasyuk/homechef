{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-1">Register a cook</h1>
<p class="text-sm text-neutral-600 mb-3">For self-help group coordinators.</p>
<form method="post" action="/register-cook" class="space-y-3 bg-white p-4 border rounded-lg">
  <input name="name" value="{{ name or '' }}" placeholder="Cook's name" required
         class="w-full border rounded px-3 py-2">
  <input name="phone" value="{{ phone or '' }}" placeholder="Phone (e.g. +9198...)" required
         class="w-full border rounded px-3 py-2">
  <input name="area" value="{{ area or '' }}" placeholder="Area (e.g. Koramangala)" required
         class="w-full border rounded px-3 py-2">
  <input name="address" value="{{ address or '' }}" placeholder="Pickup address" required
         class="w-full border rounded px-3 py-2">
  <label class="block text-sm">Channel
    <select name="channel" class="w-full border rounded px-3 py-2 mt-1">
      <option value="sms" {% if channel == 'sms' %}selected{% endif %}>SMS</option>
      <option value="voice" {% if channel == 'voice' %}selected{% endif %}>Voice</option>
    </select>
  </label>
  <input name="default_pickup" value="{{ default_pickup or '12:00-14:00' }}"
         placeholder="Default pickup window (e.g. 12:00-14:00)" required
         class="w-full border rounded px-3 py-2">
  {% if error %}<p class="text-sm text-red-600">{{ error }}</p>{% endif %}
  <button class="w-full bg-neutral-900 text-white py-2 rounded">Register cook</button>
</form>
{% endblock %}
